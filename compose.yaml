name: gmat

services:
  gmat-web:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-web
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-web:${CONTAINER_TAG:-latest}
    hostname: gmat-web
    container_name: gmat-web
    ports:
      - "127.0.0.1:${SERVICE_HOST_PORT:-8989}:${SERVICE_PORT:-8989}"
    environment:
      - PORT=${SERVICE_PORT:-8989}
      - GMAT_WEB_HOST=${GMAT_WEB_HOST:-localhost}
      - GMAT_GIT_COMMIT=${GMAT_GIT_COMMIT:-}
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-vnc:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-vnc
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-vnc:${CONTAINER_TAG:-latest}
    hostname: gmat-vnc
    container_name: gmat-vnc
    environment:
      - DISPLAY=:1
    ports:
      - "127.0.0.1:${VNC_HOST_PORT:-15801}:80"
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-console:
    platform: linux/amd64
    profiles:
      - console
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-build-native
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-console:${CONTAINER_TAG:-latest}
    hostname: gmat-console
    container_name: gmat-console
    networks:
      - gmat-network

networks:
  gmat-network:
    driver: bridge
