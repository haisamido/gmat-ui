name: gmat

services:
  gmat-web:
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: wasm
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-web:${CONTAINER_TAG:-latest}
    hostname: gmat-web
    container_name: gmat-web
    ports:
      - "${SERVICE_HOST_PORT:-8989}:${SERVICE_PORT:-8989}"
    environment:
      - PORT=${SERVICE_PORT:-8989}
      - GMAT_WEB_HOST=${GMAT_WEB_HOST:-localhost}
      - GIT_COMMIT=${GIT_COMMIT:-}
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-x11:
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: native
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-native:${CONTAINER_TAG:-latest}
    hostname: gmat-x11
    container_name: gmat-x11
    command: ["./GMAT"]
    environment:
      - DISPLAY=${GMAT_DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof GMAT || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gmat-network

  gmat-console:
    profiles:
      - console
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: native
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-native:${CONTAINER_TAG:-latest}
    hostname: gmat-console
    container_name: gmat-console
    networks:
      - gmat-network

networks:
  gmat-network:
    driver: bridge
