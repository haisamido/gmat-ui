name: gmat

services:
  gmat-web:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: wasm
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-web:${CONTAINER_TAG:-latest}
    hostname: gmat-web
    container_name: gmat-web
    ports:
      - "${SERVICE_HOST_PORT:-8989}:${SERVICE_PORT:-8989}"
    environment:
      - PORT=${SERVICE_PORT:-8989}
      - GMAT_WEB_HOST=${GMAT_WEB_HOST:-localhost}
      - GIT_COMMIT=${GIT_COMMIT:-}
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-x11:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: native
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-x11:${CONTAINER_TAG:-latest}
    hostname: gmat-x11
    container_name: gmat-x11
    command: ["./GMAT"]
    environment:
      - DISPLAY=${GMAT_DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - GALLIUM_DRIVER=llvmpipe
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof GMAT || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gmat-network

  gmat-vnc:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: vnc
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-vnc:${CONTAINER_TAG:-latest}
    hostname: gmat-vnc
    container_name: gmat-vnc
    environment:
      - DISPLAY=:1
    ports:
      - "${VNC_HOST_PORT:-15801}:80"
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-console:
    platform: linux/amd64
    profiles:
      - console
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: native
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-x11:${CONTAINER_TAG:-latest}
    hostname: gmat-console
    container_name: gmat-console
    networks:
      - gmat-network

networks:
  gmat-network:
    driver: bridge
