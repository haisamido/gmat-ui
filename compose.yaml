name: gmat

services:
  gmat-web:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-web
      args:
        MAVEN_HTTPS_PROXY: ${MAVEN_HTTPS_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        HTTP_PROXY: ${HTTP_PROXY}
        NO_PROXY: ${NO_PROXY}
        DEPLOYMENT_ENVIRO: ${DEPLOYMENT_ENVIRO}
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-web:${CONTAINER_TAG:-latest}
    hostname: gmat-web
    container_name: gmat-web
    ports:
      - "127.0.0.1:${SERVICE_HOST_PORT:-8989}:${SERVICE_PORT:-8989}"
    environment:
      - PORT=${SERVICE_PORT:-8989}
      - GMAT_WEB_HOST=${GMAT_WEB_HOST:-localhost}
      - GMAT_GIT_COMMIT=${GMAT_GIT_COMMIT:-}
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-vnc:
    platform: linux/amd64
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-vnc
      args:
        MAVEN_HTTPS_PROXY: ${MAVEN_HTTPS_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        HTTP_PROXY: ${HTTP_PROXY}
        NO_PROXY: ${NO_PROXY}
        DEPLOYMENT_ENVIRO: ${DEPLOYMENT_ENVIRO}
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-vnc:${CONTAINER_TAG:-latest}
    hostname: gmat-vnc
    container_name: gmat-vnc
    environment:
      - DISPLAY=:1
    ports:
      - "127.0.0.1:${VNC_HOST_PORT:-15801}:80"
    volumes:
      - ./vnc/entrypoint.sh:/entrypoint.sh
      - ./vnc/fluxbox/init:/home/gmat/.fluxbox/init
      - ./vnc/fluxbox/overlay:/home/gmat/.fluxbox/overlay
      - ./vnc/fluxbox/menu:/home/gmat/.fluxbox/menu
      - ./vnc/bashrc:/home/gmat/.bashrc:ro
    networks:
      - gmat-network
    restart: unless-stopped

  gmat-console:
    platform: linux/amd64
    profiles:
      - console
    build:
      context: ${CONTAINER_CONTEXT:-.}
      dockerfile: ${CONTAINER_FILE:-Containerfile}
      target: gmat-build-native
      args:
        MAVEN_HTTPS_PROXY: ${MAVEN_HTTPS_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        HTTP_PROXY: ${HTTP_PROXY}
        NO_PROXY: ${NO_PROXY}
        DEPLOYMENT_ENVIRO: ${DEPLOYMENT_ENVIRO}
    image: ${REGISTRY_BASE:-ghcr.io/haisamido/gmat-ui}/gmat-console:${CONTAINER_TAG:-latest}
    hostname: gmat-console
    container_name: gmat-console
    networks:
      - gmat-network

networks:
  gmat-network:
    driver: bridge
