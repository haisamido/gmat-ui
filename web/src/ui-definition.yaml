      label: Spacecraft
      icon: "\U0001F680"  # 🚀
      unicode: "U+1F680"
      category: Spacecraft
      contextMenu:
        - label: Add Spacecraft
          action: addSpacecraft

    - id: formations
      label: Formations
      icon: "\U0001F6F8"  # 🛸
      unicode: "U+1F6F8"
      category: Formation
      disabled: true
      disabledReason: Requires FormationPlugin (not available in WASM)
      contextMenu:
        - label: Add Formation
          disabled: true
          title: Requires FormationPlugin (not available in WASM)

    - id: groundStations
      label: Ground Stations
      icon: "\U0001F4E1"  # 📡
      unicode: "U+1F4E1"
