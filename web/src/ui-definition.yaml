# =============================================================================
# Mission Sequence Commands
# Reference: src/gui/app/MissionPanelCtrl.js
# =============================================================================
missionCommands:
  categories:
    - label: Propagation
      commands:
        - type: Propagate
          fields: [propagator, spacecraft, stopCondition]
          detail: "{propagator}({spacecraft}) {{{stopCondition.param} = {stopCondition.value}}}"

    - label: Maneuver
      commands:
        - type: Maneuver
          fields: [burn, spacecraft]
          detail: "{burn}({spacecraft})"
        - type: BeginFiniteBurn
          fields: [burn, spacecraft]
          detail: "{burn}({spacecraft})"
        - type: EndFiniteBurn
          fields: [burn, spacecraft]
          detail: "{burn}({spacecraft})"

    - label: Targeting
      commands:
        - type: Target
          fields: [solver]
          detail: "{solver}"
        - type: Vary
          fields: [solver, variable, initialValue, perturbation, lower, upper, maxStep]
          detail: "{solver}({variable})"
        - type: Achieve
          fields: [solver, goal, value, tolerance]
          detail: "{solver}({goal} = {value})"
        - type: EndTarget
          fields: []
          detail: ""

    - label: Optimization
      commands:
        - type: Optimize
          fields: [solver]
          detail: "{solver}"
        - type: Minimize
          fields: [solver, objective]
          detail: "{solver}({objective})"
        - type: NonlinearConstraint
          fields: [solver, constraint, comparator, value]
          detail: "{solver}({constraint} {comparator} {value})"
        - type: EndOptimize
          fields: []
          detail: ""

    - label: Control Flow
      commands:
        - type: If
          fields: [condition]
          detail: "{condition}"
        - type: Else
          fields: []
          detail: ""
        - type: EndIf
          fields: []
          detail: ""
        - type: For
          fields: [variable, start, step, end]
          detail: "{variable} = {start}:{step}:{end}"
        - type: EndFor
          fields: []
          detail: ""
        - type: While
          fields: [condition]
          detail: "{condition}"
        - type: EndWhile
          fields: []
          detail: ""

    - label: Output
      commands:
        - type: Report
          fields: [reportFile, parameters]
          detail: "{reportFile} {parameters}"
        - type: Toggle
          fields: [subscriber, state]
          detail: "{subscriber} {state}"
        - type: PenUp
          fields: [subscriber]
          detail: "{subscriber}"
        - type: PenDown
          fields: [subscriber]
          detail: "{subscriber}"
        - type: MarkPoint
          fields: [subscriber]
          detail: "{subscriber}"
        - type: ClearPlot
          fields: [subscriber]
          detail: "{subscriber}"

    - label: Other
      commands:
        - type: Assignment
          label: Assignment (GMAT)
          fields: [lhs, rhs]
          detail: "{lhs} = {rhs}"
        - type: Stop
          fields: []
          detail: ""

# =============================================================================
# Console Panel
# =============================================================================
consolePanel:
  header:
    title: Console Output
    lineCount: true
    clearButton: true
  features:
    - timestamps
    - lineCount
    - search
    - clear
    - scrollToBottom
  messageTypes:
    info:
      prefix: "[INFO]"
      color: "var(--primary)"
    error:
      prefix: "[ERROR]"
      color: "var(--danger)"
    success:
      prefix: "[SUCCESS]"
      color: "var(--success)"
    warning:
      prefix: "[WARN]"
      color: "var(--warning)"

# =============================================================================
# URL Routing
# =============================================================================
routing:
  base: /ui
  routes:
    - path: /
      redirect: /Scripts/default
    - path: /Scripts
      component: scriptList
    - path: /Scripts/:name
      component: scriptEditor
    - path: /Spacecraft/:name
      component: spacecraftPanel
    - path: /Propagators/:name
      component: propagatorPanel
    - path: /Burns/:name
      component: burnPanel
    - path: /Solvers/:name
      component: solverPanel
    - path: /Output/:name
      component: outputPanel
    - path: /Hardware/:name
      component: hardwarePanel
    - path: /Variables/:name
      component: variablePanel
    - path: /CoordSystems/:name
      component: coordSystemPanel
    - path: /Orbit
      component: orbitViewer
    - path: /Report
      component: reportViewer

# =============================================================================
# Keyboard Shortcuts
# =============================================================================
shortcuts:
  - key: F5
    action: runMission
    description: Run mission
  - key: Shift+F5
    action: stopMission
    description: Stop mission
  - key: Ctrl+S
    action: saveScript
    description: Save script
  - key: F12
    action: saveScriptAs
    description: Save script as
  - key: Ctrl+O
    action: openScript
    description: Open script
  - key: Ctrl+N
    action: newMission
    description: New mission
  - key: Ctrl+Shift+N
    action: newScript
    description: New script
  - key: Ctrl+G
    action: generateScript
    description: Generate script
  - key: Ctrl+W
    action: closeCurrentTab
    description: Close current tab
  - key: Ctrl+F
    action: find
    description: Find & Replace
  - key: F3
    action: findNext
    description: Find next
  - key: Ctrl+/
    action: comment
    description: Toggle comment
  - key: Ctrl+L
    action: gotoLine
    description: Go to line
  - key: Ctrl+]
    action: indentMore
    description: Indent more
  - key: Ctrl+[
    action: indentLess
    description: Indent less
  - key: F1
    action: openUserGuide
    description: User guide
  - key: Ctrl+F1
    action: showWelcome
    description: Welcome page
  - key: Escape
    action: closeDialog
    description: Close dialog

# =============================================================================
# Theme Configuration
# =============================================================================
theme:
  name: Catppuccin Mocha
  colors:
    # Primary colors
    primary: "#89b4fa"      # Blue
    success: "#a6e3a1"      # Green
    warning: "#f9e2af"      # Yellow
    danger: "#f38ba8"       # Red/Pink

    # Background colors
    background: "#1e1e2e"   # Base
    surface: "#313244"      # Surface0
    surfaceHover: "#45475a" # Surface1
    mantle: "#181825"       # Mantle
    crust: "#11111b"        # Crust

    # Text colors
    text: "#cdd6f4"         # Text
    textMuted: "#a6adc8"    # Subtext0
    overlay0: "#6c7086"     # Overlay0
    overlay1: "#7f849c"     # Overlay1

    # Border
    border: "#45475a"       # Surface1

    # Accent colors
    lavender: "#b4befe"
    sapphire: "#74c7ec"
    sky: "#89dceb"
    teal: "#94e2d5"
    peach: "#fab387"
    maroon: "#eba0ac"
    mauve: "#cba6f7"
    flamingo: "#f2cdcd"
    rosewater: "#f5e0dc"

  fonts:
    ui: "Segoe UI, system-ui, -apple-system, sans-serif"
    code: "JetBrains Mono, Consolas, Monaco, monospace"

  sizes:
    borderRadius: 6px
    menuBarHeight: 28px
    toolbarHeight: 40px
    tabHeight: 32px

# =============================================================================
# Dialogs
# =============================================================================
dialogs:
  about:
    title: About GMAT Web GUI
    content:
      - type: heading
        text: GMAT Web GUI
      - type: paragraph
        text: General Mission Analysis Tool - WebAssembly Edition
      - type: paragraph
        text: This is a web-based interface for GMAT compiled to WebAssembly.
      - type: link
        text: GMAT Documentation
        url: https://gmat.atlassian.net/wiki/spaces/GW

  welcome:
    title: Welcome to GMAT Web GUI
    sections:
      - title: Getting Started
        items:
          - Click "Load Sample" to load an example mission
          - Press F5 or click "Run" to execute the mission
          - View results in the 3D Orbit tab and Output tab

  confirmUnsaved:
    title: Unsaved Changes
    message: You have unsaved changes. Do you want to save before continuing?
    buttons:
      - label: Save
        action: save
      - label: Don't Save
        action: discard
      - label: Cancel
        action: cancel

# =============================================================================
# CSS Styles
# Uses ID-based selectors to match the generated HTML structure
# =============================================================================
styles:
  # CSS Custom Properties (Theme Variables)
  variables: |
    :root {
      --bg: #1e1e2e;
      --base: #1e1e2e;
      --mantle: #181825;
      --crust: #11111b;
      --surface0: #313244;
      --surface1: #45475a;
      --surface2: #585b70;
      --overlay0: #6c7086;
      --overlay1: #7f849c;
      --text: #cdd6f4;
      --subtext1: #bac2de;
      --subtext0: #a6adc8;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
      --peach: #fab387;
      --mauve: #cba6f7;
      --teal: #94e2d5;
      --sky: #89dceb;
      --border: #313244;
      --left-width: 260px;
      --console-height: 180px;
    }

  # Global Reset & Base
  global: |
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }

  # Header: Menu Bar + Toolbar
  header: |
    #app-header {
      background: var(--mantle);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    #menu-bar {
      display: flex;
      align-items: center;
      padding: 0 8px;
      height: 28px;
      gap: 2px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .menu-item {
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--subtext0);
      position: relative;
    }
    .menu-item:hover { background: var(--surface0); color: var(--text); }
    @keyframes help-pulse {
      0%, 100% { color: var(--accent); text-shadow: 0 0 4px var(--accent); }
      50% { color: var(--text); text-shadow: none; }
    }
    .menu-item.help-attention {
      animation: help-pulse 1.2s ease-in-out infinite;
      cursor: pointer;
    }
    .menu-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--mantle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 0;
      min-width: 200px;
      z-index: 2000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .menu-item:hover > .menu-dropdown { display: block; }
    .menu-dropdown-item {
      padding: 5px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      color: var(--text);
    }
    .menu-dropdown-item:hover { background: var(--surface0); }
    .menu-dropdown-item .shortcut { color: var(--overlay0); font-size: 11px; }
    .menu-dropdown hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  # Toolbar
  toolbar: |
    #toolbar {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      gap: 4px;
      height: 34px;
    }
    .tb-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--subtext0);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tb-btn:hover { background: var(--surface0); color: var(--text); border-color: var(--border); }
    .tb-btn.primary { background: var(--accent); color: var(--crust); font-weight: 600; }
    .tb-btn.primary:hover { opacity: 0.85; }
    .tb-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #btn-run { background: var(--green); color: var(--crust); font-weight: 600; }
    #btn-run:hover:not(:disabled) { opacity: 0.85; }
    #btn-run:disabled { background: var(--surface1); color: var(--overlay0); opacity: 0.6; }
    .tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    #version-info {
      margin-left: auto;
      font-size: 10px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      color: var(--overlay0);
      padding: 2px 6px;
      user-select: text;
      cursor: text;
    }
    #version-info a { color: var(--sky); text-decoration: none; font-weight: 500; }
    #version-info a:hover { text-decoration: underline; }
    #status-indicator {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: auto;
    }
    #status-indicator.ready { color: var(--green); }
    #status-indicator.running { color: var(--yellow); }
    #status-indicator.error { color: var(--red); }
    #status-indicator.loading { color: var(--subtext0); }

  # App Body: Left Panel + Main Content
  appBody: |
    #app-body {
      display: grid;
      grid-template-columns: var(--left-width) 4px 1fr;
      min-height: 0;
      overflow: hidden;
    }
    #left-panel {
      display: flex;
      flex-direction: column;
      background: var(--mantle);
      min-height: 0;
      overflow: hidden;
    }
    #left-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .left-tab {
      flex: 1;
      padding: 6px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--overlay0);
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .left-tab:hover { color: var(--subtext0); }
    .left-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .left-panel-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .left-panel-content.active { display: block; }
    .resize-h {
      background: var(--border);
      cursor: col-resize;
      transition: background 0.15s;
    }
    .resize-h:hover, .resize-h.active { background: var(--accent); }
    #resize-v {
      height: 4px;
      background: var(--border);
      cursor: row-resize;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #resize-v:hover, #resize-v.active { background: var(--accent); }
    #main-content {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    #tab-bar {
      display: flex;
      background: var(--mantle);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    #tab-bar::-webkit-scrollbar { height: 0; }
    .tab-btn {
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--overlay1);
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text); background: var(--surface0); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg); }
    .tab-close {
      font-size: 14px;
      line-height: 1;
      opacity: 0.5;
      border-radius: 3px;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-close:hover { opacity: 1; background: var(--surface1); }
    .tab-icon { font-size: 10px; line-height: 1; flex-shrink: 0; }
    #tab-content {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    .tab-panel {
      display: none;
      position: absolute;
      inset: 0;
      overflow: auto;
    }
    .tab-panel.active { display: flex; flex-direction: column; }
    .tab-panel.active:has(.orbit-view-wrap) { overflow: hidden; }

  # Report Viewer
  reportViewer: |
    .report-viewer { padding: 0; display: flex; flex-direction: column; height: 100%; }
    .report-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: var(--mantle);
      border-bottom: 1px solid var(--surface0); flex-shrink: 0;
    }
    .report-toolbar select {
      background: var(--surface0); color: var(--text); border: 1px solid var(--surface1);
      border-radius: 4px; padding: 3px 8px; font-size: 12px; font-family: inherit;
    }
    .report-toolbar label { font-size: 11px; color: var(--subtext0); }
    .report-toolbar button {
      padding: 3px 10px; font-size: 11px; background: var(--surface0);
      color: var(--text); border: 1px solid var(--surface1); border-radius: 4px; cursor: pointer;
    }
    .report-toolbar button:hover { background: var(--surface1); }
    .report-table-wrap { flex: 1; overflow: auto; }
    .report-table {
      width: 100%; border-collapse: collapse;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px;
    }
    .report-table th {
      position: sticky; top: 0; z-index: 1;
      background: var(--mantle); color: var(--accent);
      text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--surface1);
      font-weight: 600; white-space: nowrap;
    }
    .report-table td {
      text-align: right; padding: 3px 10px; border-bottom: 1px solid var(--surface0);
      color: var(--text); white-space: nowrap;
    }
    .report-table tr:hover td { background: var(--surface0); }
    .report-raw {
      flex: 1; overflow: auto; padding: 8px 12px; white-space: pre;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px;
      color: var(--subtext1); background: var(--base);
    }
    .report-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--overlay0); font-size: 13px;
    }

  # Console Panel
  consolePanel: |
    #console-panel {
      display: flex;
      flex-direction: column;
      height: var(--console-height);
      min-height: 28px;
      background: var(--mantle);
      border-top: 1px solid var(--border);
    }
    #console-header {
      display: flex;
      align-items: center;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext0);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 8px;
    }
    #console-header .spacer { flex: 1; }
    #console-line-count { color: var(--overlay0); font-weight: 400; }
    #console-clear-btn {
      background: none; border: none; color: var(--overlay0);
      cursor: pointer; font-size: 11px; padding: 1px 6px; border-radius: 3px;
    }
    #console-clear-btn:hover { background: var(--surface0); color: var(--text); }
    #console-output {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--crust);
    }
    #console-output .err { color: var(--red); }
    #console-output .warn { color: var(--yellow); }
    #console-output .info { color: var(--accent); }

  # Tree View
  treeView: |
    .tree-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px 2px 0;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text);
      line-height: 22px;
      margin: 0 4px;
    }
    .tree-item:hover { background: var(--surface0); }
    .tree-item.selected { background: var(--surface1); color: var(--accent); }
    .tree-item.disabled { color: var(--overlay0); font-style: italic; position: relative; }
    .tree-item.disabled:hover { background: none; cursor: not-allowed; }
    .tree-item.disabled[title]:hover::after {
      content: attr(title);
      position: absolute;
      left: 100%;
      top: 0;
      margin-left: 6px;
      padding: 2px 5px;
      background: var(--surface1);
      border: 1px solid var(--yellow);
      border-radius: 3px;
      font-size: 9px;
      font-style: normal;
      color: var(--yellow);
      white-space: nowrap;
      z-index: 1000;
      pointer-events: none;
    }
    .tree-toggle {
      width: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--peach);
      flex-shrink: 0;
      line-height: 1;
    }
    .tree-icon {
      font-size: 13px;
      flex-shrink: 0;
      width: 18px;
      text-align: center;
    }
    .tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-toolbar {
      display: flex;
      gap: 4px;
      padding: 4px 6px;
      border-bottom: 1px solid var(--surface0);
      background: var(--mantle);
    }
    .tree-toolbar button {
      background: var(--surface0);
      border: none;
      color: var(--subtext0);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      cursor: pointer;
    }
    .tree-toolbar button:hover { background: var(--surface1); color: var(--text); }

  # Context Menu
  contextMenu: |
    .ctx-menu {
      position: fixed;
      z-index: 3000;
      background: var(--mantle);
      border: 1px solid var(--surface0);
      border-radius: 6px;
      padding: 4px 0;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      font-size: 12px;
    }
    .ctx-menu-item {
      padding: 5px 14px;
      cursor: pointer;
      color: var(--text);
    }
    .ctx-menu-item:hover { background: var(--surface0); }
    .ctx-menu-item.disabled { color: var(--overlay0); cursor: not-allowed; position: relative; }
    .ctx-menu-item.disabled:hover { background: none; }
    .ctx-menu-item.disabled[title]:hover::after {
      content: attr(title);
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 6px;
      padding: 2px 5px;
      background: var(--surface1);
      border: 1px solid var(--yellow);
      border-radius: 3px;
      font-size: 9px;
      color: var(--yellow);
      white-space: nowrap;
      z-index: 3001;
      pointer-events: none;
    }
    .ctx-menu hr { border: none; border-top: 1px solid var(--border); margin: 3px 0; }

  # Config Panels
  configPanel: |
    .config-panel { padding: 16px; overflow-y: auto; flex: 1; }
    .panel-action-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--mantle);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .panel-action-bar button {
      padding: 5px 14px; font-size: 12px; font-family: inherit;
      border: 1px solid var(--surface1); border-radius: 4px;
      background: var(--surface0); color: var(--text); cursor: pointer;
    }
    .panel-action-bar button:hover { background: var(--surface1); }
    .panel-action-bar .spacer { flex: 1; }
    .panel-section { margin-bottom: 16px; }
    .panel-section h3 {
      font-size: 12px; font-weight: 600; color: var(--accent);
      margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
    }
    .form-grid {
      display: grid; grid-template-columns: 150px 1fr;
      gap: 5px 10px; align-items: center;
    }
    .form-grid label {
      font-size: 12px; color: var(--subtext0);
      text-align: right; padding-right: 4px;
    }
    .form-grid input, .form-grid select {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; font-size: 12px; outline: none; font-family: inherit;
    }
    .form-grid input:focus, .form-grid select:focus { border-color: var(--accent); }
    .form-grid input[type=number] { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; }
    .form-grid input:disabled, .form-grid select:disabled {
      opacity: 0.6; background: var(--mantle); cursor: not-allowed;
    }

  # Script Editor
  scriptEditor: |
    .script-editor-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .script-toolbar {
      display: flex; align-items: center; padding: 4px 8px; gap: 6px;
      background: var(--mantle); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .script-toolbar button {
      background: var(--surface0); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 10px; cursor: pointer; font-size: 11px;
    }
    .script-toolbar button:hover { background: var(--surface1); }
    .script-toolbar .spacer { flex: 1; }
    .script-editor-container { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .script-highlight {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      margin: 0; padding: 8px 12px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12.5px; line-height: 1.5; tab-size: 3;
      white-space: pre-wrap; word-wrap: break-word; overflow: auto;
      color: var(--text); background: var(--bg); pointer-events: none;
    }
    .script-highlight code { font-family: inherit; font-size: inherit; background: none; }
    .script-textarea {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: transparent; color: transparent; caret-color: var(--text);
      border: none; padding: 8px 12px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12.5px; line-height: 1.5; resize: none; outline: none;
      tab-size: 3; white-space: pre-wrap; word-wrap: break-word; overflow: auto;
    }
    .script-textarea::selection { background: rgba(137,180,250,0.3); }
    .hljs { background: transparent; color: var(--text); }
    .hljs-comment, .hljs-quote { color: var(--overlay1); font-style: italic; }
    .hljs-keyword, .hljs-selector-tag { color: var(--mauve); }
    .hljs-built_in { color: var(--teal); }
    .hljs-type, .hljs-class .hljs-title { color: var(--accent); }
    .hljs-string { color: var(--green); }
    .hljs-number, .hljs-literal { color: var(--peach); }
    .hljs-title, .hljs-function .hljs-title { color: var(--accent); }
    .hljs-variable { color: var(--red); }
    .hljs-params { color: var(--text); }
    .hljs-symbol { color: var(--yellow); }
    .hljs-meta { color: var(--sky); }

  # Orbit Viewer
  orbitViewer: |
    .orbit-viewer-wrap {
      position: relative; flex: 1; background: #000;
      min-height: 0; height: 100%; width: 100%;
    }
    .orbit-viewer-wrap canvas { display: block; }
    .orbit-viewer-overlay {
      position: absolute; top: 8px; left: 12px;
      color: var(--text); font-size: 12px; pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9); line-height: 1.6;
    }
    .orbit-legend {
      position: absolute; top: 8px; right: 12px;
      color: var(--text); font-size: 11px; pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px; min-width: 80px;
    }
    .orbit-legend-title { font-weight: 600; margin-bottom: 4px; color: var(--subtext0); }
    .orbit-legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .orbit-legend-color { width: 12px; height: 3px; border-radius: 1px; flex-shrink: 0; }
    .orbit-view-wrap {
      display: flex; flex-direction: column; flex: 1;
      min-height: 0; height: 100%; position: relative; overflow: hidden;
    }
    .orbit-toolbar {
      display: flex; gap: 6px; padding: 4px 8px;
      background: var(--mantle); border-bottom: 1px solid var(--border);
    }
    .orbit-toolbar button {
      font-size: 11px; padding: 4px 8px;
      background: var(--surface0); border: 1px solid var(--surface1);
      color: var(--text); border-radius: 4px; cursor: pointer;
    }
    .orbit-toolbar button:hover { background: var(--surface1); }
    .orbit-container {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }

  # Mission List
  missionList: |
    .mission-list { padding: 4px; }
    .mission-item {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; font-size: 12px; border-radius: 4px;
      margin: 1px 4px; cursor: pointer; color: var(--text);
    }
    .mission-item:hover { background: var(--surface0); }
    .mission-item.selected { background: var(--surface1); color: var(--accent); }
    .mission-item .cmd-type { color: var(--mauve); font-weight: 600; font-size: 11px; min-width: 70px; }
    .mission-item .cmd-detail { color: var(--subtext0); font-size: 11px; }
    .mission-add-btn {
      display: block; margin: 8px auto;
      background: var(--surface0); color: var(--subtext0);
      border: 1px dashed var(--border); border-radius: 4px;
      padding: 4px 12px; cursor: pointer; font-size: 11px;
    }
    .mission-add-btn:hover { background: var(--surface1); color: var(--text); }

  # Dialog Overlay
  dialogs: |
    .dialog-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 5000;
      align-items: center; justify-content: center;
    }
    .dialog-overlay.visible { display: flex; }
    .dialog {
      background: var(--base); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px;
      min-width: 400px; max-width: 600px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    .dialog h2 { color: var(--accent); font-size: 18px; margin-bottom: 12px; }
    .dialog p { color: var(--subtext1); font-size: 13px; margin-bottom: 8px; line-height: 1.6; }
    .dialog .dialog-section { margin-bottom: 12px; }
    .dialog .dialog-section h3 { font-size: 12px; color: var(--subtext0); margin-bottom: 4px; }
    .dialog .dialog-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .dialog .dialog-links a {
      display: inline-block; padding: 6px 14px;
      background: var(--surface0); color: var(--accent);
      border-radius: 6px; text-decoration: none;
      font-size: 12px; border: 1px solid var(--border);
    }
    .dialog .dialog-links a:hover { background: var(--surface1); }
    .dialog .dialog-footer { margin-top: 16px; text-align: right; }
    .dialog .dialog-footer button {
      background: var(--accent); color: var(--crust);
      border: none; border-radius: 6px; padding: 6px 20px;
      cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .dialog .dialog-footer button:hover { opacity: 0.85; }
    .dialog .version-info { color: var(--overlay0); font-size: 11px; margin-top: 10px; }
    .dialog .example-list {
      max-height: 280px; overflow-y: auto; margin: 8px 0;
      border: 1px solid var(--surface1); border-radius: 4px; background: var(--base);
    }
    .dialog .example-item {
      display: flex; align-items: center; padding: 6px 10px;
      cursor: pointer; border-bottom: 1px solid var(--surface0);
      font-size: 13px; color: var(--text);
    }
    .dialog .example-item:last-child { border-bottom: none; }
    .dialog .example-item:hover { background: var(--accent); color: var(--crust); }
    .dialog .example-item .example-icon { margin-right: 8px; opacity: 0.7; }
    .dialog .example-item:hover .example-icon { opacity: 1; }

  # Find / Replace Bar
  findBar: |
    .find-bar {
      display: none; padding: 6px 10px;
      background: var(--mantle); border-bottom: 1px solid var(--border);
      gap: 6px; align-items: center; font-size: 12px; flex-shrink: 0;
    }
    .find-bar.visible { display: flex; }
    .find-bar input {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 8px; font-size: 12px; outline: none; width: 180px;
    }
    .find-bar input:focus { border-color: var(--accent); }
    .find-bar button {
      background: var(--surface0); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 8px; cursor: pointer; font-size: 11px;
    }
    .find-bar button:hover { background: var(--surface1); }
    .find-bar .find-count { color: var(--overlay0); font-size: 11px; min-width: 60px; }
    .find-bar .find-close {
      background: none; border: none; color: var(--overlay0);
      cursor: pointer; font-size: 16px; padding: 0 4px;
    }
    .find-bar .find-close:hover { color: var(--text); }
    .tree-rename-input {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--accent); border-radius: 3px;
      padding: 1px 4px; font-size: 12px; outline: none; width: 120px;
    }

  # Form Widgets
  widgets: |
    .file-browse { display: flex; gap: 4px; align-items: center; }
    .file-browse input[type=text] {
      flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; font-family: inherit;
    }
    .file-browse input[type=text]:focus { border-color: var(--accent); }
    .file-browse button {
      padding: 4px 8px; font-size: 12px; background: var(--surface0); color: var(--text);
      border: 1px solid var(--surface1); border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .file-browse button:hover { background: var(--surface1); }
    .slider-row {
      display: grid; grid-template-columns: 110px auto 1fr auto 60px; gap: 4px; align-items: center; margin-bottom: 6px;
    }
    .slider-row .slider-min, .slider-row .slider-max {
      font-size: 10px; color: var(--overlay0); font-family: 'SF Mono','Fira Code',Consolas,monospace; white-space: nowrap;
    }
    .slider-row label { font-size: 12px; color: var(--subtext0); text-align: right; padding-right: 4px; }
    .slider-row input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: var(--surface0); border-radius: 3px; outline: none;
    }
    .slider-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .slider-row input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; border: none;
    }
    .slider-row input[type=number] {
      width: 60px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 6px; font-size: 11px; font-family: 'SF Mono','Fira Code',Consolas,monospace;
      outline: none; text-align: right;
    }
    .slider-row input[type=number]:focus { border-color: var(--accent); }
    .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .color-row label { font-size: 12px; color: var(--subtext0); min-width: 100px; text-align: right; }
    .color-swatch {
      width: 40px; height: 22px; border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; padding: 0; background: none;
    }
    .color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch::-webkit-color-swatch { border: none; border-radius: 3px; }

  # Dual List Widget
  dualList: |
    .dual-list { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
    .dual-list-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      height: 160px; overflow-y: auto; font-size: 12px;
    }
    .dual-list-box .list-item { padding: 3px 8px; cursor: pointer; }
    .dual-list-box .list-item:hover { background: var(--surface0); }
    .dual-list-box .list-item.selected { background: var(--surface1); color: var(--accent); }
    .dual-list-btns { display: flex; flex-direction: column; gap: 4px; padding-top: 40px; }
    .dual-list-btns button {
      background: var(--surface0); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    .dual-list-btns button:hover { background: var(--surface1); }
    .dual-list-container { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
    .dual-list-col { display: flex; flex-direction: column; gap: 4px; }
    .dual-list-col label { font-size: 11px; color: var(--subtext0); }
    .dual-list-col select.dual-list {
      height: 120px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 12px;
    }

  # File List Widget
  fileList: |
    .file-list-container { margin-top: 4px; }
    .file-list {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 6px; font-size: 11px; font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      color: var(--subtext0); min-height: 40px; max-height: 100px; overflow-y: auto;
    }
    .file-list div { padding: 2px 4px; cursor: pointer; border-radius: 2px; user-select: none; }
    .file-list div:hover { background: var(--surface0); }
    .file-list div.selected { background: var(--accent); color: var(--base); }
    .file-list-btns { display: flex; gap: 6px; margin-top: 4px; }
    .file-list-btns button {
      padding: 3px 12px; font-size: 11px; border: 1px solid var(--border);
      border-radius: 4px; background: var(--surface0); color: var(--text); cursor: pointer;
    }
    .file-list-btns button:hover { background: var(--surface1); }

  # Body Panel (Celestial Body Config)
  bodyPanel: |
    .body-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      margin: -16px -16px 12px -16px; padding: 0 8px; background: var(--mantle);
      flex-shrink: 0; position: sticky; top: -16px; z-index: 10;
    }
    .body-tab-btn {
      padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer;
      color: var(--overlay1); border: none; background: none;
      border-bottom: 2px solid transparent; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .body-tab-btn:hover { color: var(--text); }
    .body-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .body-tab-pane { display: none; }
    .body-tab-pane.active { display: block; }
    .body-panel-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .body-panel-header h2 { font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
    .body-panel-header .body-type {
      font-size: 11px; color: var(--overlay0); background: var(--surface0);
      padding: 2px 8px; border-radius: 10px;
    }

  # Visualization Grid
  visGrid: |
    .vis-grid { display: grid; grid-template-columns: 1fr 420px; gap: 0 12px; }
    .vis-left { min-width: 0; }
    .vis-right { position: relative; overflow: hidden; }
    .vis-right-heading {
      font-size: 13px; font-weight: 600; color: var(--accent);
      margin: 8px 0 6px; padding: 0 4px;
    }

  # Model Preview
  modelPreview: |
    .model-preview-container {
      position: absolute; top: 60px; left: 0; right: 0; bottom: 0;
      border: 1px solid var(--surface1); border-radius: 6px;
      overflow: hidden; background: var(--crust);
    }
    .model-preview-container canvas { display: block; width: 100%; height: 100%; }
    .model-preview-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--overlay1); font-size: 12px; pointer-events: none;
    }
    .model-preview-toolbar { display: flex; gap: 6px; padding: 4px 0; }
    .model-preview-toolbar button {
      font-size: 11px; padding: 4px 8px;
      background: var(--surface0); border: 1px solid var(--surface1);
      color: var(--text); border-radius: 4px; cursor: pointer;
    }
    .model-preview-toolbar button:hover { background: var(--surface1); }
    .model-preview-toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .model-preview-toolbar button.active { background: var(--accent); color: var(--crust); }
