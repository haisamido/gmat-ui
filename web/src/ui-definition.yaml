# GMAT WebAssembly UI Definition
# Complete declarative specification of the GMAT Web GUI
# Generated from codebase analysis of deployments/web/src/gui/

version: "1.0"
name: GMAT Web GUI
description: General Mission Analysis Tool - WebAssembly Interface
cppReference: src/gui/app/GmatMainFrame.cpp

# =============================================================================
# Application Layout
# =============================================================================
layout:
  type: split-panel
  direction: horizontal
  children:
    - id: left-panel
      width: 280px
      minWidth: 200px
      maxWidth: 500px
      resizable: true
      tabs:
        - id: resources
          label: Resources
          default: true
        - id: mission
          label: Mission
        - id: output
          label: Output

    - id: main-content
      flex: 1
      contains:
        - tabBar: true
        - tabContent: true

    - id: console-panel
      position: bottom
      height: 200px
      minHeight: 100px
      resizable: true
      collapsible: true

# =============================================================================
# Menu Bar
# =============================================================================
menuBar:
  items:
    - label: File
      items:
        - id: menu-new-script
          label: New Script
          shortcut: Ctrl+Shift+N
          action: newScript
        - id: menu-new-mission
          label: New Mission
          shortcut: Ctrl+N
          action: newMission
        - separator: true
        - id: menu-open-script
          label: Open...
          shortcut: Ctrl+O
          action: openScript
        - separator: true
        - id: menu-save-script
          label: Save Script
          shortcut: Ctrl+S
          action: saveScript
        - id: menu-save-script-as
          label: Save Script As...
          shortcut: F12
          action: saveScriptAs

    - label: Edit
      items:
        - id: menu-undo
          label: Undo
          shortcut: Ctrl+Z
          action: undo
        - id: menu-redo
          label: Redo
          shortcut: Ctrl+Y
          action: redo
        - separator: true
        - id: menu-cut
          label: Cut
          shortcut: Ctrl+X
          action: cut
        - id: menu-copy
          label: Copy
          shortcut: Ctrl+C
          action: copy
        - id: menu-paste
          label: Paste
          shortcut: Ctrl+V
          action: paste
        - separator: true
        - id: menu-select-all
          label: Select All
          shortcut: Ctrl+A
          action: selectAll
        - separator: true
        - id: menu-find
          label: Find & Replace...
          shortcut: Ctrl+F
          action: find
        - id: menu-find-next
          label: Find Next
          shortcut: F3
          action: findNext
        - separator: true
        - id: menu-comment
          label: Comment
          shortcut: Ctrl+/
          action: comment
        - id: menu-uncomment
          label: Uncomment
          shortcut: Ctrl+Shift+/
          action: uncomment
        - separator: true
        - id: menu-goto-line
          label: Go to Line...
          shortcut: Ctrl+L
          action: gotoLine
        - id: menu-indent-more
          label: Indent More
          shortcut: Ctrl+]
          action: indentMore
        - id: menu-indent-less
          label: Indent Less
          shortcut: Ctrl+[
          action: indentLess

    - label: Run
      items:
        - id: menu-run
          label: Run Script
          shortcut: F5
          action: runMission
        - id: menu-stop
          label: Stop
          shortcut: Shift+F5
          action: stopMission
        - separator: true
        - id: menu-generate
          label: Generate Script
          shortcut: Ctrl+G
          action: generateScript

    - label: Window
      items:
        - id: menu-close-tab
          label: Close Current Tab
          shortcut: Ctrl+W
          action: closeCurrentTab
        - id: menu-close-all
          label: Close All Tabs
          action: closeAllTabs

    - label: Help
      items:
        - id: menu-welcome
          label: Welcome Page
          shortcut: Ctrl+F1
          action: showWelcome
        - separator: true
        - id: menu-help-contents
          label: User Guide
          shortcut: F1
          action: openUserGuide
        - id: menu-help-tutorials
          label: Tutorials
          action: openTutorials
        - separator: true
        - id: menu-help-report
          label: Report an Issue
          action: reportIssue
        - separator: true
        - id: menu-help-docs
          label: GMAT Documentation
          action: openDocs
        - id: menu-help-console
          label: Simple Console
          action: openSimpleConsole
        - id: menu-help-earth
          label: Earth Viewer
          action: openEarthViewer
        - separator: true
        - id: menu-about
          label: About GMAT Web GUI
          action: showAbout

# =============================================================================
# Toolbar
# =============================================================================
toolbar:
  items:
    - id: btn-new-mission
      label: New Mission
      title: New Mission (Ctrl+N)
      action: newMission
    - id: btn-open
      label: Open
      title: Open Script (Ctrl+O)
      action: openScript
    - id: btn-save
      label: Save
      title: Save Script (Ctrl+S)
      action: saveScript
    - separator: true
    - id: btn-run
      label: "▶ Run"
      title: Run Script (F5)
      action: runMission
      style: primary
      disabled: true  # Enabled when WASM loads
    - id: btn-stop
      label: "■ Stop"
      title: Stop (Shift+F5)
      action: stopMission
      disabled: true
    - separator: true
    - id: btn-generate
      label: Generate Script
      title: Generate Script (Ctrl+G)
      action: generateScript
    - separator: true
    - id: btn-example
      label: Load Sample
      action: loadSample
    - separator: true
    - id: btn-close-all
      label: Close All
      title: Close All Tabs
      action: closeAllTabs
    - id: status-indicator
      type: status
      initialText: Loading WASM...
      class: loading

# =============================================================================
# Resource Tree Structure
# Reference: src/gui/app/ResourceTreeCtrl.js
# =============================================================================
resourceTree:
