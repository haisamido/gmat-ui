# =============================================================================
# Name Prefixes for Auto-Generated Names
# =============================================================================
namePrefixes:
  Spacecraft: Spacecraft
  Formation: Formation
  ForceModel: FM
  Propagator: Prop
  ImpulsiveBurn: ImpBurn
  FiniteBurn: FinBurn
  DifferentialCorrector: DC
  VF13ad: VF13ad
  ReportFile: DefaultReport
  OrbitView: OrbitView
  XYPlot: XYPlot
  EphemerisFile: EphemFile
  Variable: Var
  Array: Arr
  String: Str
  GroundStation: GndStn
  CoordinateSystem: CoordSys
  ChemicalTank: ChemTank
  ElectricTank: ElecTank
  ChemicalThruster: ChemThruster
  ElectricThruster: ElecThruster
  SolarPowerSystem: SolarPower
  NuclearPowerSystem: NuclearPower
  FileInterface: FileInterface
  EclipseLocator: EclLocator
  ContactLocator: ContLocator
  GmatFunction: GmatFunc

# =============================================================================
# Main Content Tabs
# =============================================================================
mainTabs:
  builtIn:
    - id: script
      label: Script
      icon: code
      closable: false
      content:
        type: code-editor
        language: gmat
        highlightjs: matlab
        features:
          - syntaxHighlighting
          - lineNumbers
          - findReplace
          - gotoLine
          - comment
          - indent

    - id: orbit
      label: 3D Orbit
      icon: globe
      closable: false
      content:
        type: orbit-viewer
        renderer: threejs
        version: "0.172.0"
        features:
          - celestialBodies
          - orbitTrajectories
          - groundTracks
          - lighting
          - earthShader
          - atmosphereGlow
          - starField

    - id: output
      label: Output
      icon: file-text
      closable: false
      content:
        type: report-viewer
        features:
          - tableView
          - csvExport

  dynamic:
    description: Panels opened from resource tree
    titlePattern: "{objectType}: {objectName}"
    idPattern: "panel-{objectName}"

# =============================================================================
# Configuration Panels
# Reference: src/gui/app/PanelFactory.js
# =============================================================================
panels:
  Spacecraft:
    controller: SpacecraftPanel
    cppReference: src/base/spacecraft/Spacecraft.cpp
    tabs:
      - label: Orbit
        fields:
          - name: DateFormat
            type: select
            options: [UTCGregorian, TAIModJulian, TTModJulian, A1ModJulian, UTCModJulian, TDBModJulian]
            default: UTCGregorian
          - name: Epoch
            type: datetime
            default: "01 Jan 2024 12:00:00.000"
          - name: CoordinateSystem
            type: select
            default: EarthMJ2000Eq
          - name: DisplayStateType
            type: select
            options: [Cartesian, Keplerian, SphericalAZFPA, SphericalRADEC, Equinoctial, ModifiedEquinoctial, Delaunay, Planetodetic, OutgoingAsymptote, IncomingAsymptote, BrouwerMeanShort, BrouwerMeanLong]
            default: Keplerian
          - name: SMA
            label: Semi-major Axis
            type: number
            unit: km
            default: 7191.938817629013
          - name: ECC
            label: Eccentricity
            type: number
            default: 0.02454974900598091
          - name: INC
            label: Inclination
            type: number
            unit: deg
            default: 12.85008005658097
          - name: RAAN
            label: Right Ascension of Ascending Node
            type: number
            unit: deg
            default: 306.6148021947984
          - name: AOP
            label: Argument of Periapsis
            type: number
            unit: deg
            default: 314.1905515359921
          - name: TA
            label: True Anomaly
            type: number
            unit: deg
            default: 99.88774933204886
      - label: Attitude
        fields:
          - name: AttitudeModel
            type: select
            options: [CoordinateSystemFixed, Spinner, SpiceAttitude, PrecessingSpinner, NadirPointing, ThreeAxisKinematic]
            default: CoordinateSystemFixed
          - name: AttitudeCoordinateSystem
            type: select
            default: EarthMJ2000Eq
          - name: AttitudeStateType
            type: select
            options: [EulerAngles, Quaternion, DirectionCosineMatrix]
            default: EulerAngles
          - name: EulerSequence
            type: select
            options: ["123", "132", "213", "231", "312", "321"]
            default: "321"
          - name: EulerAngle1
            type: number
            unit: deg
            default: 0
          - name: EulerAngle2
            type: number
            unit: deg
            default: 0
          - name: EulerAngle3
            type: number
            unit: deg
            default: 0
      - label: Ballistic/Mass
        fields:
          - name: DryMass
            type: number
            unit: kg
            default: 850
          - name: Cd
            label: Coefficient of Drag
            type: number
            default: 2.2
          - name: Cr
            label: Coefficient of Reflectivity
            type: number
            default: 1.8
          - name: DragArea
            type: number
            unit: m²
            default: 15
          - name: SRPArea
            label: SRP Area
            type: number
            unit: m²
            default: 1
      - label: Tanks
        fields:
          - name: Tanks
            type: multi-select
            objectType: [ChemicalTank, ElectricTank]
      - label: Thrusters
        fields:
          - name: Thrusters
            type: multi-select
            objectType: [ChemicalThruster, ElectricThruster]
      - label: Power System
        fields:
          - name: PowerSystem
            type: select
            objectType: [SolarPowerSystem, NuclearPowerSystem]
      - label: Visualization
        fields:
          - name: ModelFile
            type: text
            default: aura.3ds
          - name: ModelScale
            type: number
            default: 1.0
          - name: OrbitColor
            type: color
            default: "#ff0000"
          - name: TargetColor
            type: color
            default: "#008080"

  Formation:
    controller: FormationSetupPanel
    fields:
      - name: Add
        label: Spacecraft Members
        type: multi-select
        objectType: Spacecraft

  ForceModel:
    controller: PropagatorPanel
    cppReference: src/base/forcemodel/ODEModel.cpp
    fields:
      - name: CentralBody
        type: select
        default: Earth
      - name: PrimaryBodies
        type: multi-select
        default: [Earth]
      - name: PointMasses
        type: multi-select
        default: []
      - name: SRP
        label: Solar Radiation Pressure
        type: select
        options: ["On", "Off"]
        default: "Off"
      - name: RelativisticCorrection
        type: select
        options: ["On", "Off"]
        default: "Off"
      - name: "GravityField.Earth.Degree"
        type: number
        default: 4
      - name: "GravityField.Earth.Order"
        type: number
        default: 4
      - name: "GravityField.Earth.PotentialFile"
        type: select
        options: [JGM2.cof, JGM3.cof, EGM96.cof, GGM02C.cof, GGM03C.cof]
        default: JGM2.cof

  Propagator:
    controller: PropagatorPanel
    cppReference: src/base/propagator/Propagator.cpp
    fields:
      - name: FM
        label: Force Model
        type: select
        objectType: ForceModel
      - name: Type
        type: select
        options: [RungeKutta89, RungeKutta68, PrinceDormand45, PrinceDormand78, BulirschStoer, AdamsBashforthMoulton]
        default: RungeKutta89
      - name: InitialStepSize
        type: number
        unit: sec
        default: 60
      - name: Accuracy
        type: number
        default: 9.999999999999999e-12
      - name: MinStep
        type: number
        unit: sec
        default: 0.001
      - name: MaxStep
        type: number
        unit: sec
        default: 2700
      - name: MaxStepAttempts
        type: number
        default: 50
      - name: StopIfAccuracyIsViolated
        type: boolean
        default: true

  ImpulsiveBurn:
    controller: ImpulsiveBurnPanel
    cppReference: src/base/burn/ImpulsiveBurn.cpp
    fields:
      - name: CoordinateSystem
        type: select
        options: [Local, EarthMJ2000Eq, EarthFixed]
