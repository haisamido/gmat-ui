# Build and publish GMAT Docker images to GitHub Container Registry

# To enable arm64: uncomment the arm64 matrix entries below and the
# manifest job, then switch the build job to push-by-digest mode.
# Native arm64 runners (ubuntu-24.04-arm) avoid slow QEMU emulation.

name: Docker Image CI

on:
  push:
    branches: ["main", "dev", "issue-*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gmat-web
            image_name: gmat-web
          - target: gmat-vnc
            image_name: gmat-vnc
          # --- arm64 (uncomment to enable multi-arch) ---
          # - target: gmat-web
          #   image_name: gmat-web
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64
          # - target: gmat-vnc
          #   image_name: gmat-vnc
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64

    steps:
      - name: Free up disk space
        if: ${{ !env.ACT }}
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push builds: tag, push to GHCR
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GMAT_GIT_COMMIT_FULL=${{ github.sha }}
            REPO_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      # PR / local builds: validate only, no login or push needed
      - name: Build (validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            GMAT_GIT_COMMIT_FULL=${{ github.sha }}
            REPO_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}

