# Build and publish GMAT Docker images to GitHub Container Registry
#
# Builds three targets from Containerfile:
#   wasm       - Browser-based GMAT (node:20-slim, port 8989)
#   native     - Console GMAT (ubuntu:26.04)
#   native-gui - X11 GUI GMAT (ubuntu:26.04)
#
# Images are tagged as:
#   ghcr.io/haisamido/gmat-nasa:{web,console,x11}-<branch>  (always)
#   ghcr.io/haisamido/gmat-nasa:{web,console,x11}          (main branch only)
#
# Usage:
#   docker pull ghcr.io/haisamido/gmat-nasa:web
#   docker run -p 8989:8989 ghcr.io/haisamido/gmat-nasa:web
#   docker run -it ghcr.io/haisamido/gmat-nasa:console
#   docker run -it ghcr.io/haisamido/gmat-nasa:x11
#
# To enable arm64: uncomment the arm64 matrix entries below and the
# manifest job, then switch the build job to push-by-digest mode.
# Native arm64 runners (ubuntu-24.04-arm) avoid slow QEMU emulation.

name: Docker Image CI

on:
  push:
    branches: ["main", "dev", "issue-*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm
            suffix: web
          - target: native
            suffix: console
          - target: native-gui
            suffix: x11
          # --- arm64 (uncomment to enable multi-arch) ---
          # - target: wasm
          #   suffix: web
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64
          # - target: native
          #   suffix: console
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64
          # - target: native-gui
          #   suffix: x11
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64

    steps:
      - name: Free up disk space
        if: ${{ !env.ACT }}
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.suffix }}-${{ github.ref_name }}
            type=raw,value=${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}

      # Push builds: tag, push to GHCR
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_FULL=${{ github.sha }}
            REPO_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      # PR / local builds: validate only, no login or push needed
      - name: Build (validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            GIT_COMMIT_FULL=${{ github.sha }}
            REPO_COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}

