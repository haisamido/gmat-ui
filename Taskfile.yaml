# GMAT Container Orchestration
# https://taskfile.dev
#
# Usage:
#   task --list          # List all available tasks
#   task up:web          # Build and start the web UI
#   task up:x11          # Build and start the native GUI (X11)
#   task logs:web        # Follow web UI logs
#   task down:web        # Stop the web UI
#   task help            # Show detailed help

version: '3'

silent: true

vars:
  CONTAINER_BIN: docker
  OS: '{{OS}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ===========================================================================
  # Web service
  # ===========================================================================

  pull:web:
    desc: Pull the gmat-web image
    cmds:
      - "{{.CONTAINER_BIN}} compose pull gmat-web"

  build:web:
    desc: Build the gmat-web image
    cmds:
      - "{{.CONTAINER_BIN}} compose build gmat-web"

  rebuild:web:
    desc: Rebuild the gmat-web image (no cache)
    cmds:
      - "{{.CONTAINER_BIN}} compose build --no-cache gmat-web"

  up:web:
    desc: Start the gmat-web service
    aliases: [start:web, run:web]
    cmds:
      - "{{.CONTAINER_BIN}} compose up -d --build --remove-orphans gmat-web"

  down:web:
    desc: Stop the gmat-web service
    aliases: [stop:web]
    cmds:
      - "{{.CONTAINER_BIN}} compose rm -fs gmat-web"

  logs:web:
    desc: Follow gmat-web logs
    cmds:
      - "{{.CONTAINER_BIN}} compose logs -f gmat-web"

  clean:web:
    desc: Remove gmat-web container and image
    deps: [down:web]
    cmds:
      - "{{.CONTAINER_BIN}} rmi gmat-builder:latest 2>/dev/null || true"

  # ===========================================================================
  # X11 service
  # ===========================================================================

  pull:x11:
    desc: Pull the gmat-x11 image
    cmds:
      - "{{.CONTAINER_BIN}} compose pull gmat-x11"

  build:x11:
    desc: Build the gmat-x11 image
    cmds:
      - "{{.CONTAINER_BIN}} compose build gmat-x11"

  rebuild:x11:
    desc: Rebuild the gmat-x11 image (no cache)
    cmds:
      - "{{.CONTAINER_BIN}} compose build --no-cache gmat-x11"

  up:x11:
    desc: Start the gmat-x11 service (X11 GUI)
    aliases: [start:x11, run:x11]
    deps: [check:x11]
    cmds:
      - |
        if [[ "$OSTYPE" == "darwin"* ]]; then
          xhost +localhost
        else
          xhost +local:docker
        fi
      - "{{.CONTAINER_BIN}} compose up -d --build --remove-orphans gmat-x11"

  down:x11:
    desc: Stop the gmat-x11 service
    aliases: [stop:x11]
    cmds:
      - "{{.CONTAINER_BIN}} compose rm -fs gmat-x11"

  logs:x11:
    desc: Follow gmat-x11 logs
    cmds:
      - "{{.CONTAINER_BIN}} compose logs -f gmat-x11"

  clean:x11:
    desc: Remove gmat-x11 container and image
    deps: [down:x11]
    cmds:
      - "{{.CONTAINER_BIN}} rmi gmat-native-gui:latest 2>/dev/null || true"

  # ===========================================================================
  # All services
  # ===========================================================================

  build:
    desc: Build all images
    deps: [build:web, build:x11]

  rebuild:
    desc: Rebuild all images (no cache)
    deps: [rebuild:web, rebuild:x11]

  up:
    desc: Start all services
    aliases: [start, run]
    deps: [check:x11]
    cmds:
      - |
        if [[ "$OSTYPE" == "darwin"* ]]; then
          xhost +localhost
        else
          xhost +local:docker
        fi
      - "{{.CONTAINER_BIN}} compose up -d --build --remove-orphans"

  down:
    desc: Stop all services
    aliases: [stop]
    cmds:
      - "{{.CONTAINER_BIN}} compose down --remove-orphans"

  clean:
    desc: Remove all containers, images, and networks
    cmds:
      - "{{.CONTAINER_BIN}} compose down --rmi all --volumes --remove-orphans"

  # ===========================================================================
  # Utility
  # ===========================================================================

  check:x11:
    desc: Check that X11 server is running on the host
    cmds:
      - |
        if [[ "$OSTYPE" == "darwin"* ]]; then
          if ! pgrep -q Xquartz; then
            echo "ERROR: XQuartz is not running."
            echo "  Start XQuartz and enable 'Allow connections from network clients'"
            echo "  in XQuartz > Settings > Security."
            exit 1
          fi
          if ! lsof -i TCP:6000 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "ERROR: XQuartz is not listening on TCP port 6000."
            echo "  Enable 'Allow connections from network clients' in XQuartz > Settings > Security,"
            echo "  then restart XQuartz."
            exit 1
          fi
        else
          if [ -z "$DISPLAY" ]; then
            echo "ERROR: DISPLAY is not set. Is an X11 server running?"
            exit 1
          fi
          if [ ! -e /tmp/.X11-unix/X0 ]; then
            echo "ERROR: X11 socket /tmp/.X11-unix/X0 not found. Is an X11 server running?"
            exit 1
          fi
        fi

  help:
    desc: Show detailed help and usage information
    cmds:
      - |
        echo "=== GMAT Container Tasks ==="
        echo ""
        echo "Per-service (replace 'web' with 'x11' for native GUI):"
        echo "  task pull:web         Pull pre-built image"
        echo "  task build:web        Build image"
        echo "  task rebuild:web      Rebuild image (no cache)"
        echo "  task up:web           Start service  (aliases: start:web, run:web)"
        echo "  task down:web         Stop service   (aliases: stop:web)"
        echo "  task logs:web         Follow logs"
        echo "  task clean:web        Remove container and image"
        echo ""
        echo "All services:"
        echo "  task build            Build all images"
        echo "  task rebuild          Rebuild all images (no cache)"
        echo "  task up               Start all services  (aliases: start, run)"
        echo "  task down             Stop all services   (aliases: stop)"
        echo "  task clean            Remove all containers, images, and networks"
        echo ""
        echo "Utility:"
        echo "  task check:x11        Verify X11 server is running"
        echo "  task help             Show this help"
