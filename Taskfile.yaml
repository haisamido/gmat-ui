        echo "  build/install/          - Installation scripts"
        echo "  src/                    - Core source code (~48 MB)"
        echo "    src/base/             - Core library"
        echo "    src/gui/              - GUI application"
        echo "    src/console/          - Console application"
        echo "    src/gmatutil/         - Utility library"
        echo "    src/csalt/            - CSALT optimization"
        echo "  plugins/                - Plugin source (~40 MB)"
        echo "  depends/                - Dependency config (not binaries)"
        echo "    configure.py          - Downloads CSPICE, etc."
        echo "    CMakeLists.txt        - Dependency setup"
        echo "  swig/                   - API binding interfaces"
        echo "  application/data/           - Runtime data (~240 MB)"
        echo "  application/bin/*.txt,*.ini - Config files only"
        echo "  application/samples/        - Sample scripts"
        echo ""
        echo "EXCLUDED (not needed):"
        echo "  cmake-build/            - Build cache (rebuild)"
        echo "  .git/                   - Version history (~2.3 GB)"
        echo "  doc/                    - Documentation (~661 MB)"
        echo "  prototype/              - Experimental (~295 MB)"
        echo "  moredata/               - Extra graphics (~176 MB)"
        echo "  depends/wxWidgets/      - Use package manager instead"
        echo "  depends/cspice/         - Use package manager instead"
        echo "  depends/xerces/         - Use package manager instead"
        echo "  *.dylib, *.so, *.dll    - Compiled libraries"
        echo "  *.o, *.obj, *.a         - Object files"
        echo ""
        echo "Estimated size: ~350 MB (vs ~4.8 GB full)"

