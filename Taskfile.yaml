# GMAT Container Orchestration
# https://taskfile.dev
#
# Usage:
#   task --list          # List all available tasks
#   task up:web          # Start the web UI
#   task up:vnc          # Start VNC GUI (browser)
#   task up:console      # Start the native console
#   task logs:web        # Follow web UI logs
#   task down:web        # Stop the web UI
#   task help            # Show detailed help

version: '3'

silent: true

vars:
  CONTAINER_BIN: docker
  CONTAINER_ARCH: linux/amd64
  DOCKER_SOCK: '{{.DOCKER_HOST | default (printf "unix://%s/.docker/run/docker.sock" .HOME)}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ===========================================================================
  # Web service
  # ===========================================================================
  build:web:
    desc: Build the gmat-web image
    cmds:
      - "{{.CONTAINER_BIN}} compose build gmat-web"

  rebuild:web:
    desc: Rebuild the gmat-web image (no cache)
    cmds:
      - "{{.CONTAINER_BIN}} compose build --no-cache gmat-web"

  message:web:
    desc: Show web connection info
    cmds:
      - |
        printf '\n  GMAT Web ready at: \033[1;36mhttp://localhost:%s/ui/\033[0m\n\n' "${SERVICE_HOST_PORT:-8989}"

  up:web:
    desc: Start the gmat-web service
    aliases:
      - start:web
      - run:web
    cmds:
      - "{{.CONTAINER_BIN}} compose up -d --remove-orphans gmat-web"
      - task: message:web

  down:web:
    desc: Stop the gmat-web service
    aliases:
      - stop:web
    cmds:
      - "{{.CONTAINER_BIN}} compose rm -fs gmat-web"

  logs:web:
    desc: Follow gmat-web logs
    cmds:
      - "{{.CONTAINER_BIN}} compose logs -f gmat-web"

  clean:web:
    desc: Remove gmat-web container and image
    deps:
      - down:web
    cmds:
      - "{{.CONTAINER_BIN}} compose down --rmi local gmat-web 2>/dev/null || true"

  # ===========================================================================
  # VNC service (native GUI via browser/noVNC)
  # ===========================================================================
  build:vnc:
    desc: Build the gmat-vnc image
    cmds:
      - "{{.CONTAINER_BIN}} compose build gmat-vnc"

  rebuild:vnc:
    desc: Rebuild the gmat-vnc image (no cache)
    cmds:
      - "{{.CONTAINER_BIN}} compose build --no-cache gmat-vnc"

  message:vnc:
    desc: Show VNC connection info
    cmds:
      - |
        printf '\n  GMAT VNC ready at: \033[1;36mhttp://localhost:%s/vnc.html\033[0m\n\n' "${VNC_HOST_PORT:-15801}"

  up:vnc:
    desc: Start the gmat-vnc service (browser at http://localhost:15801/vnc.html)
    aliases:
      - start:vnc
      - run:vnc
    cmds:
      - "{{.CONTAINER_BIN}} compose up -d --remove-orphans gmat-vnc"
      - task: message:vnc

  down:vnc:
    desc: Stop the gmat-vnc service
    aliases:
      - stop:vnc
    cmds:
      - "{{.CONTAINER_BIN}} compose rm -fs gmat-vnc"

  logs:vnc:
    desc: Follow gmat-vnc logs
    cmds:
      - "{{.CONTAINER_BIN}} compose logs -f gmat-vnc"

  clean:vnc:
    desc: Remove gmat-vnc container and image
    deps:
      - down:vnc
    cmds:
      - "{{.CONTAINER_BIN}} compose down --rmi local gmat-vnc 2>/dev/null || true"

  # ===========================================================================
  # Console service (native headless)
  # ===========================================================================
  build:console:
    desc: Build the gmat-build-native image
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console build gmat-console"

  rebuild:console:
    desc: Rebuild the gmat-build-native image (no cache)
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console build --no-cache gmat-console"

  message:console:
    desc: Show console connection info
    cmds:
      - |
        printf '\n  GMAT Console running (headless). Attach with: \033[1;36mtask logs:console\033[0m\n\n'

  up:console:
    desc: Start the gmat-console service
    aliases:
      - start:console
      - run:console
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console up -d --remove-orphans gmat-console"
      - task: message:console

  down:console:
    desc: Stop the gmat-console service
    aliases:
      - stop:console
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console rm -fs gmat-console"

  logs:console:
    desc: Follow gmat-console logs
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console logs -f gmat-console"

  clean:console:
    desc: Remove gmat-console container and image
    deps:
      - down:console
    cmds:
      - "{{.CONTAINER_BIN}} compose --profile console down --rmi local gmat-console 2>/dev/null || true"

  # ===========================================================================
  # All services
  # ===========================================================================

  message:all:
    desc: Show connection info for all services
    cmds:
      - task: message:web
      - task: message:vnc
      - task: message:console

  build:
    desc: Build all images
    deps:
      - build:web
      - build:vnc

  rebuild:
    desc: Rebuild all images (no cache)
    deps:
      - rebuild:web
      - rebuild:vnc

  up:
    desc: Start all services
    aliases:
      - start
      - run
    cmds:
      - "{{.CONTAINER_BIN}} compose up -d --remove-orphans"

  down:
    desc: Stop all services
    aliases:
      - stop
    cmds:
      - "{{.CONTAINER_BIN}} compose down --remove-orphans"

  clean:
    desc: Remove all containers, images, and networks
    cmds:
      - "{{.CONTAINER_BIN}} compose down --rmi all --volumes --remove-orphans"

  # ===========================================================================
  # CI (test GitHub Actions locally with act)
  # ===========================================================================
  ci:dry-run:
    desc: Run all CI builds locally (dry-run)
    env:
      DOCKER_HOST: '{{.DOCKER_SOCK}}'
    cmds:
      - act -n --bind --container-architecture {{.CONTAINER_ARCH}} --container-daemon-socket {{.DOCKER_SOCK}} pull_request

  ci:web:
    desc: Run CI build for web target locally
    env:
      DOCKER_HOST: '{{.DOCKER_SOCK}}'
    cmds:
      - act pull_request --bind --container-architecture {{.CONTAINER_ARCH}} --container-daemon-socket {{.DOCKER_SOCK}} --matrix target:gmat-web

  ci:vnc:
    desc: Run CI build for vnc target locally
    env:
      DOCKER_HOST: '{{.DOCKER_SOCK}}'
    cmds:
      - act pull_request --bind --container-architecture {{.CONTAINER_ARCH}} --container-daemon-socket {{.DOCKER_SOCK}} --matrix target:gmat-vnc

  # ===========================================================================
  # Utility
  # ===========================================================================

  help:
    desc: Show detailed help and usage information
    cmds:
      - |
        echo "=== GMAT Container Tasks ==="
        echo ""
        echo "Per-service (replace 'web' with 'vnc' or 'console'):"
        echo "  task build:web        Build image"
        echo "  task rebuild:web      Rebuild image (no cache)"
        echo "  task up:web           Start service  (aliases: start:web, run:web)"
        echo "  task down:web         Stop service   (aliases: stop:web)"
        echo "  task logs:web         Follow logs"
        echo "  task clean:web        Remove container and image"
        echo ""
        echo "All services:"
        echo "  task build            Build all images"
        echo "  task rebuild          Rebuild all images (no cache)"
        echo "  task up               Start all services  (aliases: start, run)"
        echo "  task down             Stop all services   (aliases: stop)"
        echo "  task clean            Remove all containers, images, and networks"
        echo ""
        echo "CI (local testing with act):"
        echo "  task ci:web           Run CI for web target"
        echo "  task ci:vnc           Run CI for vnc target"
        echo "  task ci:dry-run       Dry-run all CI builds"
        echo ""
        echo "Utility:"
        echo "  task help             Show this help"
